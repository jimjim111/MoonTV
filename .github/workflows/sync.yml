name: Upstream Sync AutoMerge

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/senshinya/MoonTV.git || true
          git fetch upstream

      # 🆕 解决 Git 提交身份问题
      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Auto merge upstream changes
        run: |
          git checkout main
          git merge upstream/main -X ours --allow-unrelated-histories -m "Auto-merge upstream/main into main" || {
            echo "⚠️ Complex merge conflict detected. Manual resolution required.";
            exit 1;
          }

      - name: Push merged changes
        run: |
          git push origin main

      - name: Success
        run: echo "✅ Fork successfully synced with upstream. Local commits preserved, simple conflicts auto-resolved."
